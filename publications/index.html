    abstract: "BackgroundFacioscapulohumeral muscular dystrophy (FSHD) is a progressive neuromuscular disease. Its slow and variable progression makes the development of new treatments highly dependent on validated biomarkers that can quantify disease progression and response to drug interventions.ObjectiveWe aimed to build a tool that estimates FSHD clinical severity based on behavioral features captured using smartphone and remote sensor data. The adoption of remote monitoring tools, such as smartphones and wearables, would provide a novel opportunity for continuous, passive, and objective monitoring of FSHD symptom severity outside the clinic.MethodsIn total, 38 genetically confirmed patients with FSHD were enrolled. The FSHD Clinical Score and the Timed Up and Go (TUG) test were used to assess FSHD symptom severity at days 0 and 42. Remote sensor data were collected using an Android smartphone, Withings Steel HR+, Body+, and BPM Connect+ for 6 continuous weeks. We created 2 single-task regression models that estimated the FSHD Clinical Score and TUG separately. Further, we built 1 multitask regression model that estimated the 2 clinical assessments simultaneously. Further, we assessed how an increasingly incremental time window affected the model performance. To do so, we trained the models on an incrementally increasing time window (from day 1 until day 14) and evaluated the predictions of the clinical severity on the remaining 4 weeks of data.ResultsThe single-task regression models achieved an R2 of 0.57 and 0.59 and a root-mean-square error (RMSE) of 2.09 and 1.66 when estimating FSHD Clinical Score and TUG, respectively. Time spent at a health-related location (such as a gym or hospital) and call duration were features that were predictive of both clinical assessments. The multitask model achieved an R2 of 0.66 and 0.81 and an RMSE of 1.97 and 1.61 for the FSHD Clinical Score and TUG, respectively, and therefore outperformed the single-task models in estimating clinical severity. The 3 most important features selected by the multitask model were light sleep duration, total steps per day, and mean steps per minute. Using an increasing time window (starting from day 1 to day 14) for the FSHD Clinical Score, TUG, and multitask estimation yielded an average R2 of 0.65, 0.79, and 0.76 and an average RMSE of 3.37, 2.05, and 4.37, respectively.ConclusionsWe demonstrated that smartphone and remote sensor data could be used to estimate FSHD clinical severity and therefore complement the assessment of FSHD outside the clinic. In addition, our results illustrated that training the models on the first week of data allows for consistent and stable prediction of FSHD symptom severity. Longitudinal follow-up studies should be conducted to further validate the reliability and validity of the multitask model as a tool to monitor disease progression over a longer period.Trial registrationClinicalTrials.gov NCT04999735; https://www.clinicaltrials.gov/ct2/show/NCT04999735.",

ork activity during cognitive testing; and a task quantifying bias in emotion perception. Results: Our data analysis was organized by technology - to better understand individual features of various technologies. In many cases, we obtained simple, parsimonious models that have reasonably high diagnostic accuracy and potential to predict standard clinical outcome in depression. Conclusion: This study generated many useful insights for future methodology studies of digital technologies and proof-of-concept clinical trials in depression and possibly other indications.",

    citations: 3,
    abstract: "Special edition of the Global Drug Survey examining the impact of COVID-19 restrictions on substance use patterns and mental health.",
    url: "https://scholar.google.com/scholar?q=Global+Drug+Survey+COVID-19",
    tags: ["DRUG SURVEY"]
  },
  {
    year: 2019,
    title: "Descriptive assemblage of psychedelic microdosing: Netnographic study of Youtube videos and on-going research projects",
    authors: "A Hupli, M Berning, A Zhuparris, J Fadiman",
    journal: "Performance Enhancement & Health",
    citations: 39,
    abstract: "Background: Despite increasing clinical and neuroscientific research, pharmacological neuroenhancement literature rarely discusses psychedelic drugs. However, psychedelic microdosing has gained increasing attention.",
    url: "https://scholar.google.com/scholar?q=psychedelic+microdosing+netnographic+Youtube",
    tags: ["DRUG SURVEY"]
  }
];

// Compute total citations
const totalCitations = papers.reduce((sum, p) => sum + p.citations, 0);

// Collect unique tags for filtering
const filterCategories = ["WEARABLES", "PEDIATRICS", "CNS", "DRUG SURVEY", "ML", "CLINICAL TRIALS", "INTERVIEW", "OTHER"];

// Set total count
document.getElementById('total-count').textContent = papers.length;

let activeTag = null;

// Boot sequence
function runBootSequence() {
    const lines = document.querySelectorAll('.boot-line');
    lines.forEach((line) => {
        const delay = parseInt(line.dataset.delay, 10);
        setTimeout(() => {
            line.classList.add('visible');
        }, delay);
    });

    // Set total citations with count-up effect
    const citEl = document.getElementById('total-citations');
    setTimeout(() => {
        let current = 0;
        const step = Math.ceil(totalCitations / 30);
        const interval = setInterval(() => {
            current += step;
            if (current >= totalCitations) {
                current = totalCitations;
                clearInterval(interval);
            }
            citEl.textContent = current;
        }, 30);
    }, 400);

    // Show search and filters after boot
    setTimeout(() => {
        document.getElementById('search-bar').classList.add('visible');
        document.getElementById('filter-tags').classList.add('visible');
    }, 1400);

    // Render papers after boot
    setTimeout(() => {
        renderPapers(papers);
        revealPapers();
    }, 1600);
}

function groupOf(paper) {
    if (paper.tags.includes('INTERVIEW')) return 'INTERVIEWS & PODCASTS';
    if (paper.tags.includes('PRESS')) return 'PRESS & MENTIONS';
    return 'PUBLICATIONS';
}

const GROUP_ORDER = ['PUBLICATIONS', 'INTERVIEWS & PODCASTS', 'PRESS & MENTIONS'];

function renderPapers(list) {
    const ul = document.getElementById('paper-list');
    ul.innerHTML = '';
    let idx = 0;

    GROUP_ORDER.forEach(group => {
        const items = list.filter(p => groupOf(p) === group).slice().sort((a, b) => b.year - a.year);
        if (items.length === 0) return;

        const heading = document.createElement('li');
        heading.className = 'paper-group-heading';
        heading.textContent = group;
        ul.appendChild(heading);

        let currentYear = null;
        items.forEach(paper => {
            if (paper.year !== currentYear) {
                currentYear = paper.year;
                const yearHeading = document.createElement('li');
                yearHeading.className = 'paper-year-heading';
                yearHeading.textContent = currentYear;
                ul.appendChild(yearHeading);
            }
            renderEntry(ul, paper, idx++);
        });
    });

    document.getElementById('no-results').style.display = list.length === 0 ? 'block' : 'none';
}

function renderEntry(ul, paper, i) {
        const li = document.createElement('li');
        li.className = 'paper-entry';
        li.dataset.index = i;

        const citText = paper.citations >= 10 ? `Cited by ${paper.citations}` : '';

        li.innerHTML = `
            <div class="paper-header">
                <span class="paper-prefix">&gt;</span>
                <span class="paper-title">${escapeHtml(paper.title)}</span>
                <span class="paper-sep">&mdash;</span>
                <span class="paper-journal">${escapeHtml(paper.journal)}</span>
                ${citText ? `<span class="paper-sep">&mdash;</span><span class="paper-citations">${citText}</span>` : ''}
            </div>
            <div class="paper-abstract" id="abstract-${i}">
                <div class="paper-authors">${escapeHtml(paper.authors)}</div>
                <div class="abstract-text"></div>
                <div class="paper-tags">${paper.tags.map(t => `<span>${t}</span>`).join('')}</div>
                ${paper.url ? `<a class="paper-link" href="${paper.url}" target="_blank" rel="noopener">&gt; ${paper.url.includes('scholar.google') ? 'VIEW ON SCHOLAR' : paper.url.includes('podcasts.apple') ? 'LISTEN ON APPLE PODCASTS' : 'READ FULL ARTICLE'}</a>` : ''}
            </div>
        `;

        li.addEventListener('click', () => toggleAbstract(li, paper, i));
        ul.appendChild(li);
}

function revealPapers() {
    const entries = document.querySelectorAll('.paper-entry');
    entries.forEach((entry, i) => {
        setTimeout(() => {
            entry.classList.add('visible');
        }, i * 50);
    });
}

function toggleAbstract(li, paper, index) {
    const absDiv = document.getElementById(`abstract-${index}`);
    const isOpen = absDiv.classList.contains('open');

    // Close all others
    document.querySelectorAll('.paper-abstract.open').forEach(el => {
        el.classList.remove('open');
        el.closest('.paper-entry').classList.remove('expanded');
        el.querySelector('.abstract-text').innerHTML = '';
    });

    if (!isOpen) {
        li.classList.add('expanded');
        absDiv.classList.add('open');
        absDiv.querySelector('.abstract-text').textContent = paper.abstract;
    }
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Search
document.getElementById('search-input').addEventListener('input', function () {
    filterPapers();
});

// Filter tags
document.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', function () {
        const tag = this.dataset.tag;
        if (activeTag === tag) {
            activeTag = null;
            this.classList.remove('active');
        } else {
            document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            activeTag = tag;
            this.classList.add('active');
        }
        filterPapers();
    });
});

function filterPapers() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();

    let filtered = papers.filter(p => {
        const matchesSearch = !query ||
            p.title.toLowerCase().includes(query) ||
            p.journal.toLowerCase().includes(query) ||
            p.authors.toLowerCase().includes(query) ||
            String(p.year).includes(query);

        const matchesTag = !activeTag || p.tags.includes(activeTag);

        return matchesSearch && matchesTag;
    });

    renderPapers(filtered);
    // Reveal immediately when filtering
    document.querySelectorAll('.paper-entry').forEach(entry => {
        entry.classList.add('visible');
    });
}

// Init
document.addEventListener('DOMContentLoaded', runBootSequence);
</script>

</body>
</html>

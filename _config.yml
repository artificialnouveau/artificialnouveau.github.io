# =================================================================================
# Site Configuration
# =================================================================================

title        :  'Ahnjili ZhuParris'
lang        :  en               # Site language (en for English)
encoding      :  utf-8              # Site encoding (utf-8 for Unicode)
icon        :  '/logo.jpg'  # Site favicon
logo        :  '/logo.jpg'     # Site logo, also used in jekyll-seo-tag
url         :  'https://www.artificialnouveau.com' # Site URL, no trailing slash or seo-tag emits com//page
baseurl       :  ''               # Site base URL (add if site is not at root)
repo        :  'https://github.com/artificialnouveau/artificialnouveau.github.io'
description     :  > # Site description and default description, also used in jekyll-seo-tag
  Ahnjili ZhuParris, PhD, is an AI artist, engineer and researcher working in voice cloning, machine listening, deepfake art, critical AI and AI satire. Available for exhibitions, talks, workshops and residencies.
keywords      :  > # For SEO
  AI artist, AI art, voice cloning artist, machine listening art, critical AI art, generative voice, deepfake art, AI satire art, AI installation art, generative art, sound art, computational art

# =================================================================================
# Jekyll Settings
# =================================================================================

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ["_posts"]
exclude:
  - README.md
  - LICENSE.txt
  - CNAME
  - Gemfile
  - Gemfile.lock
  - .jekyll-cache

# Plugins
plugins:
  - jekyll-seo-tag

# Defaults
defaults:
  - # Page settings
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - # Post settings
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /gallery/:title/
  - # Fallback gallery tile. Posts set their own `thumbnail`; `image` is left
    # alone here because jekyll-seo-tag reads it for the social card.
    scope:
      path: ""
      type: "posts"
    values:
      thumbnail: '/assets/images/posts/default-post-img.jpg'
  - # One social card for every page. jekyll-seo-tag has no site-level image
    # fallback, so it has to come through as a page default.
    scope:
      path: ""
    values:
      image: '/assets/images/og-home.jpg'

# Gem settings (jekyll-seo-tag)
pinned       : false   # jekyll-seo-tag > pin the post to the top of the list
author       : Ahnjili # jekyll-seo-tag > default author
social: # jekyll-seo-tag > social overrides
  name: Ahnjili # jekyll-seo-tag > real name
  links: # jekyll-seo-tag > sameAs, so only real profiles belong here
    - https://github.com/artificialnouveau
    - https://www.instagram.com/artificialnouveau/
    - https://orcid.org/0000-0002-1413-1648
    - https://scholar.google.com/citations?user=6Xpqd-IAAAAJ

# Collections
collections:
  posts:
    output: true

# Site favicons & manifest icons
favicons: # Favicons are also used in the manifest file. Syntax is 'size: path'
  '16': '/logo.jpg'
  '32': '/logo.jpg'
  '150': '/logo.jpg'
  '180': '/logo.jpg'
  '192': '/logo.jpg'
  '512': '/logo.jpg'
  webmanifest: '/logo.jpg'
  safari: '/logo.jpg'


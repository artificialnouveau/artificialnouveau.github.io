<!-- Metadata -->
<meta charset="{{ site.encoding | default: 'utf-8' }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#efe9dc">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="author" content="{{ site.author.name }}">
<!-- Favicons -->
{% if site.favicons or site.avatarurl %}{% include site-favicons.html %}{% endif %}


{% if page.indexing == false %}
<meta name="robots" content="noindex">
{% endif %}

{% seo %}

<!-- FontAwesome (CSS build: far lighter than the JS bundle it replaces) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

<!-- Fonts: JetBrains Mono from Google Fonts, Young Serif self-hosted via paper.css -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- CSS: the paper theme, one consolidated stylesheet shared with the
     standalone subsites. -->
<link id="theme-style" rel="stylesheet" href="{{ '/assets/css/paper.css' | relative_url }}">

<!-- GoatCounter analytics -->
<script data-goatcounter="https://artnou.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- End of _includes/head.html -->

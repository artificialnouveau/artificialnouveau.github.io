<!-- Metadata -->
<meta charset="{{ site.encoding | default: 'utf-8' }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0014">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="author" content="{{ site.author.name }}">
<!-- Favicons -->
{% if site.favicons or site.avatarurl %}{% include site-favicons.html %}{% endif %}


{% if page.indexing == false %}
<meta name="robots" content="noindex">
{% endif %}

{% seo %}

<!-- FontAwesome JS-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.js" integrity="sha512-HAXr8ULpyrhyIF0miP+mFTwOagNI+UVA38US1XdtBbkU7mse59ar0ck4KBil/jyzkTO37DWLfRQvEeUWgwHu0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

{% if site.css_inline == true %}
{% include site-styles.html %}
{% else %}
<!-- CSS -->
<link id="theme-style" rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
<link id="custom-theme" rel="stylesheet" href="{{ '/assets/css/custom-theme.css' | relative_url }}">
<!-- PROTOTYPE: print-object theme, loaded last so it overrides the two above -->
<link id="print-object" rel="stylesheet" href="{{ '/assets/css/print-object.css' | relative_url }}">
{% endif %}

<!-- Drone Cursor Script -->
<script src="{{ '/assets/js/drone-cursor.js' | relative_url }}" defer></script>

<!-- GoatCounter analytics -->
<script data-goatcounter="https://artnou.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- End of _includes/head.html -->

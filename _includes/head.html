<!-- Metadata -->
<meta charset="{{ site.encoding | default: 'utf-8' }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#efe9dc">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="author" content="{{ site.author.name }}">
<!-- Favicons -->
{% if site.favicons or site.avatarurl %}{% include site-favicons.html %}{% endif %}


{% if page.indexing == false %}
<meta name="robots" content="noindex">
{% endif %}

{% seo %}

<!-- FontAwesome (CSS build: far lighter than the JS bundle it replaces) -->
<link rel="stylesheet" href="{{ '/assets/plugins/fontawesome-6.5.1/css/all.min.css' | relative_url }}">

<!-- Fonts: JetBrains Mono and Young Serif, both self-hosted -->
<link href="/assets/fonts/google/jetbrains-mono-d4b4c1.css" rel="stylesheet">

<!-- CSS: the paper theme, one consolidated stylesheet shared with the
     standalone subsites. -->
<link id="theme-style" rel="stylesheet" href="{{ '/assets/css/paper.css' | relative_url }}">

<!-- GoatCounter analytics -->
<script data-goatcounter="https://artnou.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- End of _includes/head.html -->
